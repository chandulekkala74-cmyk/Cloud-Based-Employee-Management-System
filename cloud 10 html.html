<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Employee Management System</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f5f9;
    color:#333;
}

header{
    background:#1565c0;
    color:white;
    padding:25px;
    text-align:center;
}

header h1{
    margin-bottom:8px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:25px auto;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 3px 10px #ccc;
}

.card h3{
    color:#666;
    margin-bottom:10px;
}

.card p{
    font-size:28px;
    font-weight:bold;
    color:#1565c0;
}

.form-box,.table-box{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 10px #ccc;
    margin-bottom:25px;
}

h2{
    color:#1565c0;
    margin-bottom:20px;
}

.form{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

input,select{
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    width:100%;
}

button{
    border:0;
    padding:11px 18px;
    border-radius:5px;
    color:white;
    cursor:pointer;
    margin-top:15px;
}

.add{
    background:#198754;
}

.update{
    background:#ff9800;
}

.cancel{
    background:#777;
}

.edit{
    background:#0d6efd;
    margin:2px;
}

.delete{
    background:#dc3545;
    margin:2px;
}

.search{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#1565c0;
    color:white;
}

tr:hover{
    background:#f5f5f5;
}

footer{
    background:#1565c0;
    color:white;
    text-align:center;
    padding:15px;
}

@media(max-width:700px){
    .dashboard,.form{
        grid-template-columns:1fr;
    }

    .table-box{
        overflow-x:auto;
    }

    table{
        min-width:900px;
    }
}
</style>
</head>

<body>

<header>
<h1>☁️ Cloud-Based Employee Management System</h1>
<p>Employee Management Dashboard</p>
</header>

<div class="container">

<!-- DASHBOARD -->
<div class="dashboard">

<div class="card">
<h3>Total Employees</h3>
<p id="total">0</p>
</div>

<div class="card">
<h3>Departments</h3>
<p id="departments">0</p>
</div>

<div class="card">
<h3>Average Salary</h3>
<p id="average">₹0</p>
</div>

</div>

<!-- FORM -->
<div class="form-box">

<h2 id="title">Add Employee</h2>

<div class="form">

<input id="id" placeholder="Employee ID">

<input id="name" placeholder="Employee Name">

<input id="email" type="email" placeholder="Email">

<input id="phone" placeholder="Phone Number">

<select id="department">
<option value="">Select Department</option>
<option>HR</option>
<option>IT</option>
<option>Finance</option>
<option>Marketing</option>
<option>Sales</option>
<option>Operations</option>
</select>

<input id="designation" placeholder="Designation">

<input id="salary" type="number" placeholder="Salary">

<select id="status">
<option value="">Select Status</option>
<option>Active</option>
<option>Inactive</option>
</select>

</div>

<button class="add" id="addBtn" onclick="addEmployee()">
Add Employee
</button>

<button class="update" id="updateBtn"
onclick="updateEmployee()" style="display:none;">
Update Employee
</button>

<button class="cancel" id="cancelBtn"
onclick="cancelEdit()" style="display:none;">
Cancel
</button>

</div>

<!-- TABLE -->
<div class="table-box">

<h2>Employee Records</h2>

<input class="search"
id="search"
placeholder="🔍 Search employee..."
onkeyup="displayEmployees()">

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Department</th>
<th>Designation</th>
<th>Salary</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

<footer>
Cloud-Based Employee Management System
</footer>

<script>

let employees =
JSON.parse(localStorage.getItem("employees")) || [];

let editIndex = -1;


/* ADD EMPLOYEE */

function addEmployee(){

let id=document.getElementById("id").value.trim();
let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let phone=document.getElementById("phone").value.trim();
let department=document.getElementById("department").value;
let designation=document.getElementById("designation").value.trim();
let salary=document.getElementById("salary").value;
let status=document.getElementById("status").value;

if(!id || !name || !email || !phone ||
!department || !designation || !salary || !status){

alert("Please fill all fields!");
return;

}

if(employees.some(e=>e.id===id)){

alert("Employee ID already exists!");
return;

}

employees.push({
id:id,
name:name,
email:email,
phone:phone,
department:department,
designation:designation,
salary:Number(salary),
status:status
});

save();
clearForm();
displayEmployees();
dashboard();

alert("Employee added successfully!");

}


/* DISPLAY */

function displayEmployees(){

let table=document.getElementById("table");

let search=document
.getElementById("search")
.value
.toLowerCase();

table.innerHTML="";

let result=employees.filter(e=>

e.id.toLowerCase().includes(search) ||
e.name.toLowerCase().includes(search) ||
e.department.toLowerCase().includes(search)

);

if(result.length===0){

table.innerHTML=`
<tr>
<td colspan="9" style="text-align:center;">
No employee records found
</td>
</tr>`;

return;

}

result.forEach(e=>{

let index=employees.indexOf(e);

table.innerHTML+=`

<tr>

<td>${e.id}</td>

<td>${e.name}</td>

<td>${e.email}</td>

<td>${e.phone}</td>

<td>${e.department}</td>

<td>${e.designation}</td>

<td>₹${e.salary.toLocaleString("en-IN")}</td>

<td>${e.status}</td>

<td>

<button class="edit"
onclick="editEmployee(${index})">
Edit
</button>

<button class="delete"
onclick="deleteEmployee(${index})">
Delete
</button>

</td>

</tr>

`;

});

}


/* EDIT */

function editEmployee(index){

let e=employees[index];

editIndex=index;

document.getElementById("id").value=e.id;
document.getElementById("name").value=e.name;
document.getElementById("email").value=e.email;
document.getElementById("phone").value=e.phone;
document.getElementById("department").value=e.department;
document.getElementById("designation").value=e.designation;
document.getElementById("salary").value=e.salary;
document.getElementById("status").value=e.status;

document.getElementById("id").disabled=true;

document.getElementById("title").innerText="Update Employee";

document.getElementById("addBtn").style.display="none";

document.getElementById("updateBtn").style.display="inline-block";

document.getElementById("cancelBtn").style.display="inline-block";

}


/* UPDATE */

function updateEmployee(){

if(editIndex===-1)return;

employees[editIndex].name=
document.getElementById("name").value;

employees[editIndex].email=
document.getElementById("email").value;

employees[editIndex].phone=
document.getElementById("phone").value;

employees[editIndex].department=
document.getElementById("department").value;

employees[editIndex].designation=
document.getElementById("designation").value;

employees[editIndex].salary=
Number(document.getElementById("salary").value);

employees[editIndex].status=
document.getElementById("status").value;

save();

cancelEdit();

displayEmployees();

dashboard();

alert("Employee updated successfully!");

}


/* DELETE */

function deleteEmployee(index){

if(confirm("Delete this employee?")){

employees.splice(index,1);

save();

displayEmployees();

dashboard();

}

}


/* CANCEL */

function cancelEdit(){

editIndex=-1;

clearForm();

document.getElementById("id").disabled=false;

document.getElementById("title").innerText="Add Employee";

document.getElementById("addBtn").style.display="inline-block";

document.getElementById("updateBtn").style.display="none";

document.getElementById("cancelBtn").style.display="none";

}


/* CLEAR */

function clearForm(){

document.getElementById("id").value="";
document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("phone").value="";
document.getElementById("department").value="";
document.getElementById("designation").value="";
document.getElementById("salary").value="";
document.getElementById("status").value="";

}


/* SAVE */

function save(){

localStorage.setItem(
"employees",
JSON.stringify(employees)
);

}


/* DASHBOARD */

function dashboard(){

document.getElementById("total").innerText=
employees.length;

let departments=
new Set(employees.map(e=>e.department));

document.getElementById("departments").innerText=
departments.size;

if(employees.length===0){

document.getElementById("average").innerText="₹0";
return;

}

let totalSalary=
employees.reduce(
(sum,e)=>sum+Number(e.salary),0
);

let avg=
totalSalary/employees.length;

document.getElementById("average").innerText=
"₹"+Math.round(avg).toLocaleString("en-IN");

}


/* START */

displayEmployees();

dashboard();

</script>

</body>
</html>
